name: Personal TestFlight Build (dave-atx)

# This workflow is intentionally NOT meant to run anywhere except the
# dave-atx/NetNewsWire fork, on the daily-driver branch. It archives and
# uploads a personal TestFlight build signed under Dave's own Apple
# Developer team (5WM6947328 / org.marquard), not Ranchero's. It is not
# intended to ever be merged upstream or into this fork's main branch --
# the "if: github.repository == ..." guard below is defense in depth on
# top of the fact that the required secrets only exist in this repo, and
# that this file only exists in the daily-driver branch's history.
#
# To trigger a build: bump CURRENT_PROJECT_VERSION in
# xcconfig/common/NetNewsWire_version.xcconfig, commit, then tag that
# commit and push the tag:
#   git tag dave-testflight-<n>
#   git push origin dave-testflight-<n>

on:
  push:
    tags:
      - 'dave-testflight-*'

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive-and-upload:
    name: Archive and Upload to TestFlight
    runs-on: macos-26
    if: github.repository == 'dave-atx/NetNewsWire'
    timeout-minutes: 60
    env:
      IOS_TEAM_ID: 5WM6947328
      IOS_ORG_IDENTIFIER: org.marquard
      KEYCHAIN_PATH: /tmp/testflight-signing.keychain-db
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Generate Secrets Sources
        run: PROJECT_DIR="$GITHUB_WORKSPACE" ./buildscripts/updateSecrets.sh

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Write developer signing overrides
        run: |
          set -euo pipefail
          settings_dir="$GITHUB_WORKSPACE/../SharedXcodeSettings"
          mkdir -p "$settings_dir"
          cat > "$settings_dir/DeveloperSettings.xcconfig" <<EOF
          CODE_SIGN_IDENTITY[sdk=macosx*] = Mac Developer
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphonesimulator*] = iPhone Developer
          DEVELOPMENT_TEAM = ${IOS_TEAM_ID}
          CODE_SIGN_STYLE = Automatic
          ORGANIZATION_IDENTIFIER = ${IOS_ORG_IDENTIFIER}
          DEVELOPER_ENTITLEMENTS = -dev
          PROVISIONING_PROFILE_SPECIFIER =
          EOF

      - name: Verify signing configuration resolved correctly
        run: |
          set -euo pipefail
          settings=$(xcodebuild -project NetNewsWire.xcodeproj -scheme NetNewsWire-iOS -configuration Release -showBuildSettings 2>/dev/null)
          echo "$settings" | grep -E "DEVELOPMENT_TEAM =|PRODUCT_BUNDLE_IDENTIFIER =" || true
          echo "$settings" | grep -q "DEVELOPMENT_TEAM = ${IOS_TEAM_ID}"
          echo "$settings" | grep -q "PRODUCT_BUNDLE_IDENTIFIER = ${IOS_ORG_IDENTIFIER}.NetNewsWire.iOS"

      - name: Import distribution certificate
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          CI_KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/ios_distribution.p12"
          printf '%s' "$IOS_DIST_P12_BASE64" | base64 --decode > "$cert_path"

          security create-keychain -p "$CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$cert_path" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          existing_keychains=$(security list-keychains -d user | sed 's/[[:space:]]*"\(.*\)"[[:space:]]*/\1/')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $existing_keychains
          security default-keychain -s "$KEYCHAIN_PATH"

          rm -f "$cert_path"

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project NetNewsWire.xcodeproj \
            -scheme NetNewsWire-iOS \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/NetNewsWire-iOS.xcarchive" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export .ipa
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptionsExport.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NetNewsWire-iOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptionsExport.plist" \
            -allowProvisioningUpdates

      - name: Upload .ipa as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetNewsWire-iOS-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptionsUpload.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NetNewsWire-iOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/upload" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptionsUpload.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          rm -f "$GITHUB_WORKSPACE/../SharedXcodeSettings/DeveloperSettings.xcconfig"
          security delete-keychain "$KEYCHAIN_PATH" || true
